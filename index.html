<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Saya</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1e2f, #3b3b5c);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: black;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .video-box iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            border: none;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 25px;
            background: white;
            color: #222;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .button:hover {
            transform: scale(1.05);
            background: #eeeeee;
        }

        footer {
            margin-top: 30px;
            opacity: 0.6;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Website</h1>

        <p>Selamat datang di website saya 🎵</p>

        <!-- VIDEO YOUTUBE -->
        <div class="video-box">
            <iframe
                src="https://www.youtube.com/embed/z1wI2neoJSE"
                title="YouTube Video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>

        <!-- BUTTON YOUTUBE -->
        <a
            class="button"
            href="https://youtu.be/z1wI2neoJSE?si=kWEF7KeJ1PWEmahz"
            target="_blank">
            ▶ Buka di YouTube
        </a>

        <footer>
            © 2026 My Website
        </footer>

    </div>

</body>
</html>
